name: Reporte colombia.core

on:
  schedule:
    # Corre a las 12:00 UTC = 7:00 AM hora Colombia (COT, UTC-5)
    # Días: lunes(1), miércoles(3), viernes(5)
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: {}  # te permite correrlo manualmente desde GitHub cuando quieras probar

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar reporte
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python reporte.py
